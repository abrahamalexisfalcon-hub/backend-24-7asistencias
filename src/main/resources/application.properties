# Nombre de la aplicación y puerto
spring.application.name=api-asistencias
server.port=${PORT:8080}

# Conexión PostgreSQL (NeonDB)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-mute-forest-b524iw2m-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:neondb_owner}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:npg_ULx8Sau6kGsB}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Configuración Jackson TimeZone
spring.jackson.time-zone=America/Lima

# Límites de carga de archivos y payload (Evidencias fotográficas y firmas)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB
server.tomcat.max-http-form-post-size=25MB

# Optimización de conexiones HikariCP para Neon Pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Configuración JWT (Expiración diferenciada por roles: Admin 2h = 7200000 ms, Técnico 12h = 43200000 ms)
